name: Publish to PyPI

on:
  push:
    tags:
      - "v*"

concurrency:
  # A distinct, prefixed group name -- not the shared `${{ github.workflow
  # }}-${{ github.ref }}` default -- because the called test.yml's own
  # concurrency group resolves `github.workflow` to *this* (caller)
  # workflow's name inside a reusable-workflow call, colliding with this
  # group and self-cancelling the test job before it starts (GitHub docs:
  # reusing-workflow-configurations#supported-keywords-for-jobs-that-call-a-reusable-workflow).
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    uses: ./.github/workflows/test.yml
    permissions:
      contents: read

  publish:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: pypi
    permissions:
      contents: write       # actions/checkout, plus gh release create/upload (GITHUB_TOKEN)
      id-token: write       # required for PyPI trusted publishing (OIDC) and attestation signing
      attestations: write   # required to publish a build-provenance attestation

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Verify tag is an exact plain SemVer (no pre-release suffix)
        run: |
          if [[ ! "$GITHUB_REF_NAME" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::Tag '$GITHUB_REF_NAME' is not an exact plain vMAJOR.MINOR.PATCH tag — refusing to publish" >&2
            exit 1
          fi

      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          python-version: "3.12"

      - name: Verify tag matches pyproject.toml version
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          pkg_version="$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          if [ "$tag_version" != "$pkg_version" ]; then
            echo "::error::Tag v$tag_version does not match pyproject.toml version $pkg_version" >&2
            exit 1
          fi

      - name: Build sdist and wheel
        run: uv build

      - name: Check package metadata
        run: uvx twine check dist/*

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: "dist/*"

      # Validated BEFORE the PyPI publish step, deliberately -- uv publish
      # makes this release immutably public and a failed re-run afterward
      # can never recover (PyPI rejects re-uploading the same version's
      # files), so any gate that can still be fixed by editing CHANGELOG.md
      # and re-tagging must run first, while that's still an option.
      - name: Extract this version's CHANGELOG section for release notes
        run: |
          awk -v ver="${GITHUB_REF_NAME#v}" '
            /^## \[/ { if (found) exit; if ($0 ~ "^## \\[" ver "\\]") { found=1; next } }
            found { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "::error::No CHANGELOG.md section found for version ${GITHUB_REF_NAME#v} — add one before tagging" >&2
            exit 1
          fi

      - name: Publish to PyPI
        run: uv publish

      - name: Generate SHA-256 checksums
        # Generated after attestation, so the attested dist/* subject set
        # (wheel + sdist only) never includes this derived file.
        run: |
          cd dist
          sha256sum -- * > SHA256SUMS
          cd ..

      - name: Create GitHub Release with wheel, sdist, and checksums
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --verify-tag \
            --title "$GITHUB_REF_NAME" \
            --notes-file release-notes.md \
            dist/*.whl dist/*.tar.gz dist/SHA256SUMS

  update-homebrew-tap:
    needs: publish
    runs-on: ubuntu-latest # Linuxbrew is preinstalled here too; nothing this job does is macOS-specific
    timeout-minutes: 15
    permissions: {} # only ever authenticates via secrets.TAP_REPO_PAT below, never GITHUB_TOKEN
    steps:
      - name: Checkout tap repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: jtauschl/homebrew-tap
          token: ${{ secrets.TAP_REPO_PAT }}
          persist-credentials: false # this job's own steps pass TAP_REPO_PAT explicitly where needed;
          # letting checkout write it into .git/config would leave it usable by
          # any other process in the job, e.g. a malicious transitive
          # dependency's setup.py executed below by brew update-python-resources

      - name: Add Linuxbrew to PATH
        # Preinstalled on the ubuntu-latest image but deliberately not on PATH
        # by default (actions/runner-images' own Ubuntu readme).
        run: echo "/home/linuxbrew/.linuxbrew/bin" >> "$GITHUB_PATH"

      - name: Resolve released version, sdist URL, and checksum
        # The version-specific PyPI endpoint, not the generic /json "latest"
        # one -- a just-tagged release may not be reflected there instantly,
        # and this also gives the real sdist URL directly (its path segments
        # are a content hash, not a predictable pattern from the filename).
        # Written to a file and read back by Python directly, not piped
        # through a shell variable via `echo`, which corrupts JSON containing
        # control characters.
        run: |
          version="${GITHUB_REF_NAME#v}"
          curl -sf "https://pypi.org/pypi/openproject-ce-mcp/${version}/json" -o pypi-info.json
          url="$(python3 -c 'import json; d = json.load(open("pypi-info.json")); print(next(f["url"] for f in d["urls"] if f["packagetype"] == "sdist"))')"
          sha256="$(python3 -c 'import json; d = json.load(open("pypi-info.json")); print(next(f["digests"]["sha256"] for f in d["urls"] if f["packagetype"] == "sdist"))')"
          rm pypi-info.json
          {
            echo "VERSION=$version"
            echo "SDIST_URL=$url"
            echo "SHA256=$sha256"
          } >> "$GITHUB_ENV"

      - name: Update url, sha256, and version in the Formula
        # GNU sed (this job now runs on ubuntu-latest, not macOS) takes -i
        # with no argument for "no backup file" -- BSD sed's -i requires an
        # (empty-string) argument for the same thing, so the two are not
        # interchangeable.
        run: |
          sed -i "s|^  url \".*\"|  url \"${SDIST_URL}\"|" Formula/openproject-ce-mcp.rb
          sed -i "s|^  sha256 \".*\"|  sha256 \"${SHA256}\"|" Formula/openproject-ce-mcp.rb

      - name: Regenerate pinned resource blocks
        # The one command that actually understands the dependency closure --
        # neither known Formula-bump GitHub Action regenerates resource
        # blocks, they only bump url/sha256/version (verified during
        # planning: mislav's action documents this limitation directly;
        # dawidd6's action is a thin wrapper around brew bump-formula-pr,
        # which has the same gap).
        run: |
          brew update-python-resources \
            --version="$VERSION" \
            --package-name=openproject-ce-mcp \
            --exclude-packages=pywin32 \
            Formula/openproject-ce-mcp.rb

      - name: Open a PR against the tap if the Formula changed
        env:
          GH_TOKEN: ${{ secrets.TAP_REPO_PAT }}
        run: |
          if git diff --quiet Formula/openproject-ce-mcp.rb; then
            exit 0
          fi
          # persist-credentials: false above means checkout never wrote
          # TAP_REPO_PAT into .git/config -- `gh auth setup-git` sets up git's
          # credential helper to use GH_TOKEN for this push only, instead of
          # a plaintext-URL credential that would sit in .git/config for the
          # rest of the job (including the untrusted brew update-python-resources
          # step above, which executes arbitrary transitive dependencies' setup.py).
          gh auth setup-git
          git checkout -b "bump-${VERSION}"
          git -c user.name="openproject-ce-mcp release bot" -c user.email="noreply@github.com" \
            commit -am "openproject-ce-mcp ${VERSION}"
          git push origin "bump-${VERSION}"
          gh pr create --title "openproject-ce-mcp ${VERSION}" \
            --body "Automated bump after the openproject-ce-mcp ${VERSION} PyPI release."
